worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 20s;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    limit_req_zone $binary_remote_addr zone=general:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 127.0.0.1:5191 default_server;
        server_name channelshift.net;
        if ($host != channelshift.net) { return 444; }
        if ($http_x_forwarded_proto = http) { return 308 https://channelshift.net$request_uri; }
        limit_conn connections 24;
        proxy_set_header Host $http_host;
        proxy_set_header X-ChannelShift-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://127.0.0.1:5189;
        }
        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://127.0.0.1:5189;
        }
    }
}
