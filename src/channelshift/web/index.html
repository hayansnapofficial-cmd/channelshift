<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="channelshift-token" content="__CHANNELSHIFT_TOKEN__">
    <meta name="color-scheme" content="light">
    <title>ChannelShift · 데이터베이스 워크스페이스</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/impact.css">
    <script src="/impact.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">편집기로 바로 가기</a>
    <header class="app-header">
      <a class="brand" href="/" aria-label="ChannelShift 홈">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>ChannelShift</span>
      </a>
      <div class="project-controls">
        <label class="project-label" for="project-name">프로젝트</label>
        <input id="project-name" class="project-name" value="새 프로젝트" maxlength="200" autocomplete="off" aria-label="프로젝트 이름">
        <label class="sr-only" for="database">데이터베이스</label>
        <select id="database"><option value="postgresql">PostgreSQL</option><option value="mysql">MySQL</option><option value="sqlite">SQLite</option></select>
      </div>
      <div class="header-actions"><a class="text-button" href="/delivery">제작 작업실</a><span id="save-state" class="save-state">저장 전</span><button id="save-project" class="button primary" type="button">버전 저장</button></div>
    </header>
    <nav class="workspace-nav" aria-label="작업 이동"><a href="/delivery">제작 작업실로 돌아가기</a><a href="/editor">DB 단독 편집</a></nav>

    <div class="app-layout">
      <aside class="sidebar" aria-label="시작점과 저장한 버전">
        <section class="sidebar-section templates-section">
          <div class="section-heading"><h2>템플릿</h2></div>
          <fieldset id="template-list" class="template-list"><legend class="sr-only">시작할 템플릿 선택</legend><p class="subtle loading-message">템플릿을 불러오는 중…</p></fieldset>
          <button id="generate-template" class="button primary full-width" disabled type="button">선택한 구조로 시작</button>
          <button id="new-project" class="text-button full-width" type="button">빈 프로젝트 만들기</button>
        </section>
        <section class="sidebar-section versions-section">
          <div class="section-heading"><h2>저장한 버전</h2><button id="refresh-projects" class="text-button small" type="button">새로고침</button></div>
          <div id="project-list" class="project-list"><p class="subtle">버전을 불러오는 중…</p></div>
        </section>
        <section class="sidebar-footer">
          <button id="import-trigger" class="button secondary full-width" type="button">JSON 파일 열기</button>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
        </section>
      </aside>

      <main id="workspace" class="workspace" tabindex="-1">
        <section id="delivery-link-banner" class="delivery-link-banner" aria-label="연결된 요구사항" hidden><div><strong id="delivery-link-title"></strong><a id="delivery-back-link" href="/delivery">요구사항으로 돌아가기</a></div><p id="delivery-link-help"></p></section>
        <div class="workspace-heading"><h1>데이터 구조</h1><button id="add-entity" class="button secondary" type="button"><span aria-hidden="true">+</span> 테이블 추가</button></div>
        <nav class="workspace-tabs" aria-label="구조 보기">
          <button id="entities-tab" type="button" class="workspace-tab active" aria-pressed="true">테이블 <span id="entity-count">0</span></button>
          <button id="relations-tab" type="button" class="workspace-tab" aria-pressed="false">관계 <span id="relation-count">0</span></button>
        </nav>
        <section id="entities-panel" aria-labelledby="entities-tab">
          <div id="entity-list" class="entity-list"></div>
          <div id="empty-state" class="empty-state">
            <div class="schema-symbol" aria-hidden="true"><div class="symbol-table"><b></b><i></i><i></i></div><span></span><div class="symbol-table small-table"><b></b><i></i></div></div>
            <h2>테이블 없음</h2>
            <button id="empty-add" class="button secondary" type="button">첫 테이블 만들기 <span aria-hidden="true">↗</span></button>
          </div>
        </section>
        <section id="relations-panel" class="relations-panel" aria-labelledby="relations-tab" hidden>
          <div class="relation-heading"><button id="add-relation" class="button secondary small" type="button">+ 관계 추가</button></div>
          <div id="relation-list"></div>
        </section>
        <section class="validation-section" aria-label="구조 검증">
          <div class="validation-heading"><div><span id="validation-dot" class="status-dot"></span><h2 id="validation-title">검증 대기</h2></div><button id="validate" class="text-button" type="button">구조 검증</button></div>
          <ul id="validation-issues" class="validation-issues" hidden></ul>
        </section>
      </main>

      <aside class="output-pane" aria-label="변경 영향과 코드 생성">
        <section id="impact-panel" class="impact-panel" aria-labelledby="impact-heading"></section>
        <div class="output-heading"><div class="section-heading"><h2>코드 생성</h2></div></div>
        <div class="output-tabs" role="tablist" aria-label="출력 형식">
          <button id="sql-tab" class="output-tab active" role="tab" aria-selected="true" aria-controls="output-panel" tabindex="0" type="button" data-format="sql">SQL</button>
          <button id="java-tab" class="output-tab" role="tab" aria-selected="false" aria-controls="output-panel" tabindex="-1" type="button" data-format="java">Java</button>
          <button id="json-tab" class="output-tab" role="tab" aria-selected="false" aria-controls="output-panel" tabindex="-1" type="button" data-format="json">JSON</button>
        </div>
        <div id="output-panel" class="output-panel" role="tabpanel" aria-labelledby="sql-tab">
          <div id="java-options" class="java-options" hidden><label for="java-package">Java 패키지</label><input id="java-package" value="com.example.app" maxlength="160" autocomplete="off" spellcheck="false"></div>
          <div class="output-actions"><button id="generate-output" class="button primary full-width" type="button">SQL 생성</button></div>
          <div id="file-selector-wrapper" class="file-selector-wrapper" hidden><label for="output-file">생성된 파일</label><select id="output-file"></select></div>
          <div class="code-window"><div class="code-heading"><span id="code-filename"></span><span id="code-status">생성 전</span></div><pre id="output-code" class="output-code" tabindex="0"><code id="code-content"></code></pre></div>
          <div class="download-actions"><button id="download-file" class="button secondary" disabled type="button">파일 다운로드</button><button id="copy-output" class="text-button" disabled type="button">복사</button></div>
          <button id="download-bundle" class="text-button full-width" type="button" hidden>전체 Java 파일을 JSON 묶음으로 다운로드</button>
        </div>
      </aside>
    </div>
    <div id="notification" class="notification" role="status" aria-live="polite" hidden></div>

    <dialog id="confirm-dialog" class="editor-dialog confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <h2 id="confirm-title">계속하기 전에 확인하세요.</h2>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="dialog-actions"><button id="confirm-cancel" class="button secondary" type="button">취소</button><button id="confirm-continue" class="button primary" type="button">계속</button></div>
    </dialog>

    <dialog id="relation-dialog" class="editor-dialog" aria-labelledby="relation-dialog-title">
      <form id="relation-form">
        <div class="dialog-heading"><h2 id="relation-dialog-title">관계 추가</h2><button id="close-relation" class="icon-button" aria-label="관계 추가 닫기" type="button">×</button></div>
        <label for="relation-name">관계 이름</label><input id="relation-name" required pattern="[a-z][a-z0-9_]{0,62}" maxlength="63" value="fk_relation" spellcheck="false">
        <div class="relation-form-grid"><fieldset><legend>참조하는 쪽</legend><label for="relation-from-entity">테이블</label><select id="relation-from-entity" required></select><label for="relation-from-field">외래 키 필드</label><select id="relation-from-field" required></select></fieldset><fieldset><legend>참조 대상</legend><label for="relation-to-entity">테이블</label><select id="relation-to-entity" required></select><label for="relation-to-field">기본 키 또는 고유 필드</label><select id="relation-to-field" required></select></fieldset></div>
        <label for="relation-delete">대상 데이터 삭제 시</label><select id="relation-delete"><option value="restrict">삭제 제한 · RESTRICT</option><option value="cascade">함께 삭제 · CASCADE</option><option value="set_null">참조 비우기 · SET NULL</option><option value="no_action">변경하지 않음 · NO ACTION</option></select>
        <div class="dialog-actions"><button id="cancel-relation" class="button secondary" type="button">취소</button><button class="button primary" type="submit">관계 추가</button></div>
      </form>
    </dialog>
  </body>
</html>
